            <p>Hàng loạt dự án điện mặt trời trang trại quy mô lớn tại các tỉnh Nam Trung Bộ như Ninh Thuận, Bình Thuận đã đi vào vận hành ổn định. Cùng với đó, phong trào lắp đặt điện mặt trời mái nhà tự sản tự tiêu tại các khu công nghiệp phía Nam giúp giảm tải đáng kể cho lưới điện quốc gia.</p>

        gradient: 'from-orange-600 to-red-950',
        icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
        content: `
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-orange-400 uppercase tracking-widest px-2 py-0.5 rounded bg-orange-500/10 border border-orange-500/20">Biến đổi Khí hậu</span>

            <button onclick="toggleBookmarkInModal(2)" class="flex items-center gap-1.5 text-xs text-green-400 font-bold bg-green-500/10 border border-green-500/25 px-2.5 py-1 rounded-lg">

          <h2 class="text-2xl md:text-3xl font-black text-white leading-tight mt-3 mb-6">Nhiệt độ bề mặt nước biển đạt mức cao nhất trong lịch sử đo đạc</h2>
          <div class="h-56 rounded-2xl bg-gradient-to-br from-orange-600 to-red-950 mb-6 flex items-center justify-center relative overflow-hidden border border-orange-500/30">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 1.5 2 2.5 2 4 0 1.5-1 2.5-1 3.5a2.5 2.5 0 0 0 2.5 2.5H16c.5 0 1-.5 1-1a6.88 6.88 0 0 0-3-5c2 1 4 3 4 6a4 4 0 0 1-8 0v-.5z"/></svg>

            <p>Hơn 90% nhiệt lượng dư thừa do khí nhà kính giữ lại trong bầu sinh quyển đã được đại dương hấp thụ, làm ấm các dòng hải lưu và kích hoạt các phản ứng suy giảm sinh thái biển dây chuyền. Các rạn san hô - xương sống nuôi dưỡng nguồn cá đại dương - đang bị tàn phá nặng nề.</p>
            <p>Việc kiểm soát nhiệt độ toàn cầu không tăng quá 1.5°C đang trở nên cấp bách hơn bao giờ hết để tránh kịch bản các điểm sụt đổ khí hậu không thể đảo ngược.</p>

      {

        category: 'tech',
        categoryName: 'Công nghệ Sinh thái',
        title: 'Thử nghiệm hệ thống thu giữ carbon trực tiếp từ không khí',
        summary: 'Các nhà máy công nghệ mới sử dụng phin lọc hóa chất để trực tiếp bóc tách CO2 khỏi không khí và hóa đá chúng sâu dưới lòng đất.',
        date: '21/05/2026',
        readTime: '6 phút đọc',
        gradient: 'from-cyan-600 to-blue-950',
        icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
        content: `
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/20">Công nghệ Sinh thái</span>
              <span class="text-xs text-white/40">21/05/2026 • 6 phút đọc</span>
            </div>
            <button onclick="toggleBookmarkInModal(3)" class="flex items-center gap-1.5 text-xs text-green-400 font-bold bg-green-500/10 border border-green-500/25 px-2.5 py-1 rounded-lg">
              <span id="modalBookmarkText">Đã Lưu</span>
            </button>
          </div>
          <h2 class="text-2xl md:text-3xl font-black text-white leading-tight mt-3 mb-6">Thử nghiệm hệ thống thu giữ carbon trực tiếp từ không khí</h2>
          <div class="h-56 rounded-2xl bg-gradient-to-br from-cyan-600 to-blue-950 mb-6 flex items-center justify-center relative overflow-hidden border border-cyan-500/30">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
          </div>
          <div class="text-white/80 space-y-4 text-sm md:text-base leading-relaxed">
            <p class="font-semibold text-white text-base">Công nghệ DAC (Direct Air Capture) đang chuyển dịch nhanh chóng từ phòng thí nghiệm ra quy mô công nghiệp thực tế.</p>
            <p>Hệ thống bao gồm các tua-bin thu nạp gió lớn đi qua màng hấp phụ CO2 dạng lỏng hoặc rắn. Sau đó, carbon tinh khiết thu được sẽ được hòa tan vào nước và bơm xuống lòng đất đá bazan của núi lửa để khoáng hóa thành đá chỉ trong vòng 2 năm.</p>
            <p>Phương pháp này cho phép loại bỏ chủ động carbon đã thải ra trước đó, hỗ trợ đắc lực cùng với việc trồng rừng và cắt giảm phát thải trực tiếp.</p>
          </div>
        `
      },
      {
        id: 4,
        category: 'life',
        categoryName: 'Sống Bền vững',
        title: 'Giải pháp zero-waste trong mua sắm gia đình lên ngôi',
        summary: 'Người dùng thành thị đang tích cực chuyển dịch sang sử dụng các túi vải, bình thủy tinh tái chế và mua hàng đong đầy giảm bao bì.',
        date: '18/05/2026',
        readTime: '3 phút đọc',
        gradient: 'from-teal-600 to-emerald-950',
        icon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
        content: `
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-teal-400 uppercase tracking-widest px-2 py-0.5 rounded bg-teal-500/10 border border-teal-500/20">Sống Bền vững</span>
              <span class="text-xs text-white/40">18/05/2026 • 3 phút đọc</span>
            </div>
            <button onclick="toggleBookmarkInModal(4)" class="flex items-center gap-1.5 text-xs text-green-400 font-bold bg-green-500/10 border border-green-500/25 px-2.5 py-1 rounded-lg">
              <span id="modalBookmarkText">Đã Lưu</span>
            </button>
          </div>
          <h2 class="text-2xl md:text-3xl font-black text-white leading-tight mt-3 mb-6">Giải pháp zero-waste trong mua sắm gia đình lên ngôi</h2>
          <div class="h-56 rounded-2xl bg-gradient-to-br from-teal-600 to-emerald-950 mb-6 flex items-center justify-center relative overflow-hidden border border-teal-500/30">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div class="text-white/80 space-y-4 text-sm md:text-base leading-relaxed">
            <p class="font-semibold text-white text-base">Thói quen không bao bì (zero-packaging refill) đang chuyển đổi tích cực nhận thức mua sắm của các bà nội trợ đô thị.</p>
            <p>Các cửa hàng bán lẻ đong đầy chất tẩy rửa hữu cơ, gia vị và ngũ cốc vào bình người mua mang theo ngày càng xuất hiện nhiều. Phương thức này loại bỏ hoàn toàn các loại chai nhựa dùng một lần vốn mất hàng thế kỷ để phân hủy.</p>
            <p>Mỗi bước chuyển đổi nhỏ từ việc từ chối một túi nilon tại siêu thị đến phân loại rác hữu cơ tại bếp gia đình đều góp phần trực tiếp làm sạch hệ thống cống rãnh đô thị.</p>
          </div>
        `
      }
    ];

    // Bookmarked articles tracking array
    const bookmarkedIds = [];
    let currentCategory = 'all';

    // Render Filters
    function renderFilters() {
      const CATEGORIES = [
        { id: 'all', name: 'Tất cả' },
        { id: 'energy', name: 'Năng lượng Xanh' },
        { id: 'climate', name: 'Biến đổi Khí hậu' },
        { id: 'tech', name: 'Công nghệ Sinh thái' },
        { id: 'life', name: 'Sống Bền vững' },
        { id: 'bookmarks', name: `Đã lưu (${bookmarkedIds.length})` }
      ];

      const wrap = document.getElementById('categoryFilters');
      wrap.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.name;
        btn.className = `px-4 py-2 text-xs md:text-sm font-semibold rounded-xl transition-all ${
          currentCategory === cat.id 
            ? 'bg-gradient-to-r from-green-400 to-green-600 text-white shadow-lg shadow-green-500/25' 
            : 'text-white/70 hover:text-white hover:bg-white/10'
        }`;
        btn.onclick = () => {
          currentCategory = cat.id;
          renderFilters();
          filterNews();
        };
        wrap.appendChild(btn);
      });
    }

    // Filter and Render News Grid
    function filterNews() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '';

      const filtered = ARTICLES.filter(art => {
        let matchesCategory = false;
        if (currentCategory === 'all') {
          matchesCategory = true;
        } else if (currentCategory === 'bookmarks') {
          matchesCategory = bookmarkedIds.includes(art.id);
        } else {
          matchesCategory = art.category === currentCategory;
        }
        const matchesSearch = art.title.toLowerCase().includes(searchVal) || art.summary.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12">
            <p class="text-white/40 font-medium">Không tìm thấy tin tức phù hợp.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(art => {
        const isBookmarked = bookmarkedIds.includes(art.id);
        const card = document.createElement('div');
        card.className = 'glass-card p-5 flex flex-col gap-4 cyber-border-box relative overflow-hidden cursor-pointer transition-all duration-300 hover:-translate-y-1';
        card.onclick = () => openModal(art.id);
        card.innerHTML = `
          <div class="hud-corner hud-corner-tl"></div>
          <div class="hud-corner hud-corner-tr"></div>
          <div class="hud-corner hud-corner-bl"></div>
          <div class="hud-corner hud-corner-br"></div>
          
          <!-- Gradient Image Header -->
          <div class="h-40 rounded-xl bg-gradient-to-br ${art.gradient} flex items-center justify-center relative overflow-hidden border border-white/5">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:12px_12px]"></div>
            ${art.icon}
            
            <!-- Bookmark Button -->
            <button onclick="toggleBookmark(event, ${art.id})" class="absolute top-2.5 right-2.5 p-1.5 rounded-lg bg-black/50 border border-white/10 text-white hover:scale-105 active:scale-95 transition-all z-10">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="${isBookmarked ? '#4ade80' : 'none'}" stroke="${isBookmarked ? '#4ade80' : 'currentColor'}" stroke-width="2.5">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
              </svg>
            </button>
          </div>
          
          <div class="flex items-center justify-between text-[0.70rem] text-white/40 font-semibold uppercase tracking-wider">
            <span>${art.categoryName}</span>
            <span>${art.date}</span>
          </div>
          
          <h3 class="text-base font-black text-white leading-snug flex-grow hover:text-green-400 transition-colors">
            ${art.title}
          </h3>
          
          <p class="text-xs text-white/60 leading-relaxed line-clamp-2">
            ${art.summary}
          </p>
          
          <div class="flex items-center justify-between mt-2 pt-3 border-t border-white/10">
            <span class="text-[0.70rem] text-white/40">${art.readTime}</span>
            <span class="text-xs text-green-400 font-bold flex items-center gap-1 hover:gap-2 transition-all">Đọc bài →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Toggle Bookmarks
    function toggleBookmark(e, id) {
      if (e) e.stopPropagation(); // Prevent card details click
      const idx = bookmarkedIds.indexOf(id);
      if (idx > -1) {
        bookmarkedIds.splice(idx, 1);
      } else {
        bookmarkedIds.push(id);
      }
      renderFilters();
      filterNews();
    }

    function toggleBookmarkInModal(id) {
      toggleBookmark(null, id);
      // Update modal button state text
      const isBookmarked = bookmarkedIds.includes(id);
      const btnText = document.getElementById('modalBookmarkText');
      if (btnText) {
        btnText.textContent = isBookmarked ? 'Đã Lưu' : 'Lưu Tin';
      }
    }

    // Modal Control
    function openModal(id) {
      const art = ARTICLES.find(a => a.id === id);
      if (!art) return;
      document.getElementById('modalBody').innerHTML = art.content;
      
      // Sync modal bookmark text
      const isBookmarked = bookmarkedIds.includes(id);
      const btnText = document.getElementById('modalBookmarkText');
      if (btnText) {
        btnText.textContent = isBookmarked ? 'Đã Lưu' : 'Lưu Tin';
      }

      document.getElementById('newsModal').classList.add('active');
    }

    function closeModalDirect() {
      document.getElementById('newsModal').classList.remove('active');
    }

    function closeModal(e) {
      if (e.target.id === 'newsModal') {
        closeModalDirect();
      }
    }

    // Document listener for ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    // Init Page elements
    window.addEventListener('DOMContentLoaded', () => {
      renderFilters();
      filterNews();
    });
  </script>

  <!-- 3D Background -->
  <script src="js/bg3d.js?v=4.0"></script>

</body>
</html>
