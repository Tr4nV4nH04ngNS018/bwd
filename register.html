<!DOCTYPE html>
<!-- Xác định ngôn ngữ chính của tài liệu là tiếng Việt -->
<html lang="vi">
<head>
    <!-- Khởi tạo bảng mã ký tự UTF-8 hỗ trợ tiếng Việt có dấu hoàn hảo -->
    <meta charset="UTF-8">
    <!-- Cấu hình chế độ hiển thị linh hoạt (Responsive) trên màn hình di động và máy tính -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mô tả ngắn gọn về trang đăng ký để tối ưu hóa SEO -->
    <meta name="description" content="Trang đăng ký EcoImpact - Tham gia cộng đồng xanh của chúng tôi.">
    <!-- Tiêu đề hiển thị trên thanh tab trình duyệt -->
    <title>EcoImpact | Đăng ký</title>
    <!-- Liên kết đến tệp style CSS tùy biến riêng cho trang đăng ký -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Màn hình chờ (Loading Screen) cao cấp hiển thị trong lúc trang đang tải tài nguyên nặng -->
  <div id="loading-screen" class="loading-screen">
    <!-- Khung căn giữa màn hình chờ -->
    <div class="loading-container">
      <!-- Khu vực hiển thị Logo và tên thương hiệu EcoImpact phát sáng neon -->
      <div class="loader-logo">
        <svg class="loader-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" fill="rgba(61,220,132,0.14)" stroke="#3ddc84" stroke-width="2"/>
          <path d="M32 14C22 20 18 30 20 39C22 48 28 53 32 54C36 53 42 48 44 39C46 30 42 20 32 14Z" fill="#22c55e" opacity="0.95"/>
          <path d="M32 22C31 29 29 35 26 43" stroke="#ecfff2" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <path d="M32 22C36 28 38 35 40 43" stroke="#ecfff2" stroke-width="2" stroke-linecap="round" opacity="0.42"/>
        </svg>
        <span class="loader-logo-text">EcoImpact</span>
      </div>
      <!-- Hiệu ứng vòng xoay quay tròn kép (ngoài xuôi, trong ngược chiều) -->
      <div class="loader-spinner-wrapper">
        <div class="loader-spinner"></div>
        <div class="loader-spinner-inner"></div>
      </div>
      <!-- Dòng trạng thái tải dữ liệu -->
      <div class="loader-text">Đang khởi tạo hệ sinh thái...</div>
    </div>
  </div>

    <!-- Khối cha chính chia bố cục màn hình đăng ký (chia đôi: Trái giới thiệu, Phải form đăng ký) -->
    <main class="login-page">
        <!-- Phần giới thiệu thương hiệu và thông điệp xanh bên trái (Hero Section) -->
        <section class="login-hero" aria-label="Giới thiệu EcoImpact">
            <!-- Khung chứa nội dung thông điệp -->
            <div class="hero-content">
                <!-- Tiêu đề lớn của thông điệp thương hiệu -->
                <h1 class="hero-title">EcoImpact: Vì một tương lai xanh</h1>
                <!-- Phụ đề chi tiết định hướng người dùng đến hành vi sống xanh -->
                <p class="hero-subtitle">Cùng nhau xây dựng thói quen sống xanh, bền vững và tích cực hơn mỗi ngày.</p>
            </div>
        </section>

        <!-- Phần panel chứa form đăng ký bên phải -->
        <section class="login-panel" aria-label="Khu vực đăng ký">
            <!-- Thanh điều hướng phụ phía trên đầu của panel -->
            <header class="topbar">
                <!-- Liên kết quay lại trang chủ và logo của EcoImpact -->
                <a class="brand" href="index.html" aria-label="EcoImpact trang chủ">
                    <!-- Icon thương hiệu vẽ bằng SVG nhỏ gọn -->
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21c5-3 7-7.4 7-12-4.8 0-9 1.8-11.5 4.4C5.9 15.3 7.9 19 12 21Z"></path>
                            <path d="M12 21c0-4.6-1.7-8.5-5.5-12"></path>
                            <path d="M17 8c-2 0-3.7.7-5 2"></path>
                        </svg>
                    </span>
                    EcoImpact
                </a>

                <!-- Liên kết nhanh tới các tài nguyên khác trên website -->
                <nav class="nav" aria-label="Điều hướng">
                    <a href="index.html">Home</a>
                    <a href="community.html">About</a>
                </nav>
            </header>

            <!-- Vỏ bọc chứa thẻ card đăng ký căn giữa của panel -->
            <div class="form-shell">
                <!-- Thẻ chứa nội dung form đăng ký (login-card) -->
                <article class="login-card">
                    <!-- Tiêu đề lớn chào mừng người dùng -->
                    <h1>Tạo tài khoản</h1>
                    <!-- Dòng văn bản phụ hướng dẫn -->
                    <p class="lead">Bắt đầu hành trình xanh của bạn ngay hôm nay.</p>

                    <!-- Form thu thập thông tin đăng ký tài khoản mới -->
                    <form class="login-form" novalidate>
                        <!-- Ô nhập liệu Họ và tên kèm nhãn và icon SVG bên trái -->
                        <label class="field" for="fullname">
                            <!-- Icon hình người dùng biểu thị Họ và tên -->
                            <span class="field-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <!-- Trường nhập họ và tên, bắt buộc nhập -->
                            <input id="fullname" type="text" name="fullname" placeholder="Họ và tên" autocomplete="name" required>
                        </label>

                        <!-- Ô nhập liệu Email kèm nhãn và icon SVG bên trái -->
                        <label class="field" for="email">
                            <!-- Icon phong bì thư biểu thị email -->
                            <span class="field-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                                    <path d="m4 7 8 6 8-6"></path>
                                </svg>
                            </span>
                            <!-- Trường nhập địa chỉ email, tự động hoàn thành, bắt buộc nhập -->
                            <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" required>
                        </label>

                        <!-- Ô nhập liệu Mật khẩu kèm nút Toggle ẩn/hiện mật khẩu và icon khóa -->
                        <label class="field" for="password">
                            <!-- Icon chiếc ổ khóa biểu thị mật khẩu bảo mật -->
                            <span class="field-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="10" width="16" height="10" rx="2.5"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                            </span>
                            <!-- Trường nhập mật khẩu, bắt buộc nhập -->
                            <input id="password" type="password" name="password" placeholder="Mật khẩu" autocomplete="new-password" required>
                            <!-- Nút bấm hiển thị mật khẩu -->
                            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" data-toggle-password>Hiện</button>
                        </label>

                        <!-- Ô nhập lại Mật khẩu để tránh gõ nhầm -->
                        <label class="field" for="confirm-password">
                            <!-- Icon chiếc ổ khóa biểu thị xác nhận mật khẩu -->
                            <span class="field-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="10" width="16" height="10" rx="2.5"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                            </span>
                            <!-- Trường xác nhận lại mật khẩu, bắt buộc nhập -->
                            <input id="confirm-password" type="password" name="confirm-password" placeholder="Xác nhận mật khẩu" autocomplete="new-password" required>
                            <!-- Nút bấm hiển thị lại xác nhận mật khẩu -->
                            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" data-toggle-confirm-password>Hiện</button>
                        </label>

                        <!-- Nút gửi form thực hiện đăng ký tài khoản mới -->
                        <button class="primary-action" type="submit">Đăng ký</button>

                        <!-- Nút đăng ký nhanh qua Google -->
                        <button class="secondary-action" type="button" aria-label="Đăng ký với Google">
                            <!-- Logo Google bằng SVG -->
                            <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
                                <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.4 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.9z"></path>
                                <path fill="#FF3D00" d="M6.3 14.7 12.9 19C14.7 14.6 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.4 29.4 4 24 4 16.1 4 9.2 8.5 6.3 14.7z"></path>
                                <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.2C29.4 35.3 26.9 36 24 36c-5.2 0-9.6-3.1-11.3-7.5l-6.6 5.1C9 39.6 16 44 24 44z"></path>
                                <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-1.1 3.2-3.3 5.6-5.9 7.5h.1l6.3 5.2C35.4 39 44 33 44 24c0-1.3-.1-2.3-.4-3.9z"></path>
                            </svg>
                            Đăng ký với Google
                        </button>

                        <!-- Chỉ dẫn cho người dùng đã có tài khoản -->
                        <p style="text-align: center; margin-top: 1rem; color: var(--muted);">
                            Đã có tài khoản? <a href="login.html" style="color: var(--green); text-decoration: none; font-weight: 600;">Đăng nhập</a>
                        </p>
                        <!-- Hiển thị thông báo lỗi/thành công tự động gửi từ auth.js -->
                        <p class="message" aria-live="polite"></p>
                    </form>
                </article>
            </div>
        </section>
    </main>

    <!-- Nhúng logic auth xử lý kiểm tra đăng ký và ghi vào localStorage mock_users_v1 -->
    <script src="auth.js"></script>

  </body>
</html>
